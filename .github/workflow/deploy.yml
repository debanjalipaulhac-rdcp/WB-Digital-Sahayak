name: CI/CD — WB Digital Sahayak

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: ap-south-1

# ─────────────────────────────────────────────
# JOB 1 — Detect which folders changed
# This drives ALL other jobs
# ─────────────────────────────────────────────
jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4

      - name: Check changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  # ─────────────────────────────────────────────
  # JOB 2 — Test Backend (only if backend changed)
  # ─────────────────────────────────────────────
  test-backend:
    name: Test Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install & test
        run: |
          cd backend
          pip install -r requirements.txt
          pytest tests/ -v

  # ─────────────────────────────────────────────
  # JOB 3 — Test Frontend (only if frontend changed)
  # ─────────────────────────────────────────────
  test-frontend:
    name: Test Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install & lint
        run: |
          cd frontend
          npm ci
          npm run lint
          npm run type-check

  # ─────────────────────────────────────────────
  # JOB 4 — Deploy Backend → AWS Lambda
  # Only if backend changed + tests passed + main branch
  # ─────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend → AWS Lambda
    needs: [changes, test-backend]
    if: |
      needs.changes.outputs.backend == 'true' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install SAM CLI
        run: pip install aws-sam-cli

      - name: Build
        run: |
          cd backend
          sam build --no-cached

      - name: Deploy to Lambda
        run: |
          cd backend
          sam deploy \
            --stack-name wb-digital-sahayak \
            --resolve-image-repos \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --region ${{ env.AWS_REGION }}

      - name: Print live API URL
        run: |
          aws cloudformation describe-stacks \
            --stack-name wb-digital-sahayak \
            --region ${{ env.AWS_REGION }} \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text

  # ─────────────────────────────────────────────
  # JOB 5 — Deploy Frontend → Vercel
  # Only if frontend changed + tests passed + main branch
  # ─────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend → Vercel
    needs: [changes, test-frontend]
    if: |
      needs.changes.outputs.frontend == 'true' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel environment
        run: |
          cd frontend
          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: |
          cd frontend
          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.API_URL }}

      - name: Deploy
        run: |
          cd frontend
          vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}